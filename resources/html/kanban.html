<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban - Project View</title>
    <link rel="stylesheet" href="style.css">
    <script>(function(){try{var t=localStorage.getItem('pv-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
<body>
    <header class="site-header">
        <h1>Project View</h1>
        <nav class="main-nav">
            <a href="index.html">Overview</a>
            <a href="kanban.html" class="active">Kanban</a>
            <a href="releases.html">Releases</a>
            <a href="time.html">Time Tracking</a>
        </nav>
        <div class="user-menu" data-user-menu></div>
    </header>
    <main class="container container-wide">
        <h2>Kanban Board</h2>
        <div class="category-filter">
            <label class="category-filter-label" for="category-filter-input">Filter by category</label>
            <input type="text" id="category-filter-input" data-category-filter placeholder="e.g. Mods / Skyrim">
            <button type="button" class="category-filter-clear" data-category-filter-clear>Clear</button>
        </div>
        <div class="kanban" data-view="kanban">
            <p class="muted" data-loading>Loading kanban board&hellip;</p>
        </div>
    </main>
    <div class="detail-overlay" data-detail-overlay hidden>
        <div class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <button type="button" class="detail-close" data-detail-close aria-label="Close">&times;</button>
            <div class="detail-body" data-detail-body>
                <p class="muted">Loading&hellip;</p>
            </div>
        </div>
    </div>
    <footer class="site-footer">
        <nav class="footer-nav">
            <a href="imprint.html">Imprint</a>
        </nav>
        <p>&copy; 2026 Björn Büttner &middot; <a href="https://github.com/idrinth/project-view" target="_blank" rel="noopener">Source on GitHub</a></p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
