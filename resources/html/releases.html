<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Releases - Project View</title>
    <link rel="stylesheet" href="style.css">
    <script>(function(){try{var t=localStorage.getItem('pv-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
<body>
    <header class="site-header">
        <h1>Project View</h1>
        <nav class="main-nav">
            <a href="index.html">Overview</a>
            <a href="kanban.html">Kanban</a>
            <a href="releases.html" class="active">Releases</a>
            <a href="time.html">Time Tracking</a>
        </nav>
        <div class="user-menu" data-user-menu></div>
    </header>
    <main class="container">
        <h2>Releases</h2>
        <p class="muted">Historical version releases across all tracked projects.</p>
        <div class="category-filter">
            <label class="category-filter-label" for="category-filter-input">Filter by category</label>
            <input type="text" id="category-filter-input" data-category-filter placeholder="e.g. Mods / Skyrim">
            <button type="button" class="category-filter-clear" data-category-filter-clear>Clear</button>
        </div>
        <div class="releases" data-view="releases">
            <p class="muted" data-loading>Loading releases&hellip;</p>
        </div>
    </main>
    <footer class="site-footer">
        <p><a href="imprint.html">Imprint</a> &middot; &copy; 2026 Björn Büttner &middot; <a href="https://github.com/idrinth/project-view" target="_blank" rel="noopener">Source on GitHub</a></p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
